name: housekeeping

# Manually-triggered chores fuer die Maven-Pakete dieses Repos. Task aus dem Dropdown waehlen:
#
#  * **prunePackagesDryRun** — zeigt NUR an, was geloescht wuerde. Nichts wird angefasst.
#  * **prunePackages**       — loescht tatsaechlich.
#
# Regel:
#
#   1. Jede Version mit `-SNAPSHOT` im Namen faellt weg. Sie hat nach dem zugehoerigen
#      Release keinen Wert: Die Apps (app/iot/schuetu/guild) bauen per fester
#      Familienregel immer gegen eine RELEASED root-Version, nie gegen einen SNAPSHOT,
#      und root selbst baut seine Module aus dem eigenen Reactor.
#   2. Von den Releases bleiben pro Paket die **neuesten KEEP_NEWEST (10)** stehen.
#   3. SCHUTZKLAUSEL — zwei Stufen, beide aus `pins/` (siehe unten):
#      a) Jede Version, die eine Consumer-App namentlich referenziert, bleibt stehen.
#      b) Und alles, was **nicht aelter** ist als die aelteste referenzierte Version
#         ("Bodenlinie"). Ohne (b) waere (a) unvollstaendig: Ein Pin, der aus irgendeinem
#         Grund hinterherhinkt, wuerde nur die ALTE Version schuetzen und ausgerechnet die
#         neuere, tatsaechlich benutzte, ins Messer laufen lassen. Mit (b) kann ein
#         veralteter Pin nur noch ZU VIEL behalten — nie zu wenig.
#   4. Ein Paket wird nie vollstaendig geleert.
#
# WARUM NUR 10 (23.08.2026, Karte 942):
# Es geht hier NICHT um Speicher — der ist geklaert. Dieses Repo und alle 30 Pakete sind
# oeffentlich, und oeffentliche Pakete sind bei GitHub kostenlos (die Billing-API weist den
# Packages-Storage aus, rabattiert ihn aber zu 100 %, netto 0 $). Es geht um
# Informationshygiene: Die publizierten Jars enthalten `application.yml` und
# `plaintext-defaults.yml` mit sehr ausfuehrlichen Security-Kommentaren — interne
# Hostnamen, ein dokumentierter Session-ID-Vorfall, die Messung offener /api-docs.
# Publizierte Artefakte lassen sich nicht nachtraeglich aendern, nur loeschen. Ein kurzes
# Fenster von 10 Versionen sorgt dafuer, dass korrigierte Staende die alten binnen Tagen
# herausrotieren, statt dass Hunderte alter Jars den Altstand konservieren.
#
# WOHER DIE SCHUTZINFORMATION KOMMT — UND WARUM KEIN PAT MEHR (24.08.2026, Karte 942):
# Bis hierher las dieser Workflow die vier `pom.xml` direkt aus den Consumer-Repos. Die sind
# PRIVAT; das `GITHUB_TOKEN` dieses oeffentlichen Repos kommt nicht heran, der Lauf brach
# fail-closed ab und verlangte ein PAT `PACKAGES_PRUNE_TOKEN`. Das ist jetzt umgedreht:
# **jede App schreibt ihren Pin selbst hierher**, nach `pins/<repo>.env`, aus
# `.github/workflows/publish-root-pin.yaml` im jeweiligen Consumer-Repo. Dort ist der
# Schreibzugriff ohnehin vorhanden (`AUTOBUMP_TOKEN`, Write-Collaborator `Plaintext-User`),
# hier waere Lesezugriff auf fremde private Repos noetig gewesen. Es musste kein einziges
# Token neu eingerichtet werden. Details: `pins/README.md`.
#
# Die Pins liegen auf dem eigenen Branch `pins`, nicht auf `master`: `master` ist geschuetzt
# ("Changes must be made through a pull request"), der Write-Collaborator kann dort nicht
# direkt committen — nur Administratoren kommen daran vorbei, und ein Admin-Token in vier
# Consumer-Repos waere mehr Recht als noetig. Ausserdem ist `master` das ausgelieferte
# Maven-Repository und soll nicht mehrmals taeglich Bot-Commits bekommen. Gelesen wird ueber
# die Contents-API mit `?ref=pins`; dieser Workflow checkt gar nichts aus.
#
# Verworfen wurden dabei:
#  * **Workflow in ein privates Repo umziehen** — loest nichts. Auch plaintext-root kann die
#    pom.xml von app/iot/schuetu/guild nicht lesen; jedes dieser Repos ist gegenueber den
#    anderen genauso fremd wie dieses hier. Das Tokenproblem waere nur umgezogen.
#  * **Statt Pins ein Zeitfenster** ("behalte alles der letzten N Tage") — an den echten
#    Daten durchgerechnet: 201 Pin-Wechsel der vier Apps seit Maerz 2026. Seit es den
#    Auto-Bump gibt (August) liegt der groesste Rueckstand bei 76 h, der Median bei 17 h —
#    damit waere N=7 bequem sicher. Davor aber gab es 12 Faelle ueber 7 Tagen und zweimal
#    27,4 Tage (1.169.0 in iot und schuetu bis zum 02.06.2026). Ein sicheres N waere also
#    ~30 Tage; bei der aktuellen Kadenz von 13 Releases in 5 Tagen sind das ~78 Versionen je
#    Paket statt 10 — genau die Informationshygiene, um die es oben geht, waere dahin. Und
#    strukturell bleibt es unsicher: schuetu ist eine Turnier-App, die ohne weiteres eine
#    Saison lang stillstehen darf. Ein Zeitfenster kann das nicht wissen, ein Pin schon.
#
# FAIL CLOSED bleibt fail closed: fehlt ein Pin, ist er unlesbar, nennt er eine Version, die
# es im Register gar nicht (mehr) gibt, oder ist er seit ueber PIN_MAX_DAYS nicht mehr
# aufgefrischt worden, bricht der Lauf ab, ohne etwas zu loeschen.

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Task to run'
        required: true
        default: 'prunePackagesDryRun'
        type: choice
        options:
          - prunePackagesDryRun
          - prunePackages

permissions:
  packages: write
  contents: read

env:
  KEEP_NEWEST: '10'
  CONSUMERS: 'plaintext-app plaintext-iot plaintext-schuetu plaintext-guild'
  # Referenzpaket fuer die Zeitachse: plaintext-root-parent wird bei JEDEM root-Release
  # publiziert (es ist die Parent-POM), also traegt es die vollstaendige Versionslinie.
  REF_PACKAGE: 'ch.plaintext.plaintext-root-parent'
  # Branch, auf dem die Consumer ihre Pins ablegen (siehe pins/README.md).
  PIN_BRANCH: 'pins'
  # Der Heartbeat der Consumer laeuft woechentlich. Ab PIN_WARN_DAYS ist etwas auffaellig,
  # ab PIN_MAX_DAYS (vier verpasste Heartbeats) ist die Datenlage nicht mehr vertrauenswuerdig.
  PIN_WARN_DAYS: '10'
  PIN_MAX_DAYS: '30'

jobs:
  run:
    name: ${{ inputs.task }}
    runs-on: ubuntu-22.04
    steps:
      - name: ${{ inputs.task }}
        env:
          GH_TOKEN: ${{ github.token }}
          ORG: ${{ github.repository_owner }}
          TASK: ${{ inputs.task }}
          DRY_RUN: ${{ inputs.task == 'prunePackagesDryRun' && 'true' || 'false' }}
        run: |
          set -euo pipefail

          now_ts=$(date -u +%s)

          # ── Schritt 1: Pins einlesen ─────────────────────────────────────────────
          # Ein fehlender oder kaputter Pin ist KEIN "dann halt ohne Schutz", sondern das
          # Ende des Laufs. Lieber gar nicht aufgeraeumt als eine benutzte Version geloescht.
          protected=""
          pin_report=""
          for repo in ${CONSUMERS}; do
            pin="${PIN_BRANCH}:pins/${repo}.env"
            body=$(gh api "/repos/${GITHUB_REPOSITORY}/contents/pins/${repo}.env?ref=${PIN_BRANCH}" \
                     --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d 2>/dev/null || true)
            if [ -z "$body" ]; then
              echo "::error::${pin} fehlt oder ist leer — die Schutzklausel kann nicht ausgewertet werden."
              echo "::error::Schreibt ${repo} seinen Pin? Siehe .github/workflows/publish-root-pin.yaml dort."
              echo "::error::Existiert der Branch '${PIN_BRANCH}' noch?"
              echo "::error::Abbruch ohne zu loeschen (fail closed)."
              exit 1
            fi

            vers=$(printf '%s\n' "$body" | sed -n 's/^versions=//p' | head -1)
            upd=$(printf '%s\n'  "$body" | sed -n 's/^updated=//p'  | head -1)

            # Nur echte Versionsnummern zaehlen. Ein Pin, der versehentlich "${...}" oder
            # Leerstring enthaelt, ist unplausibel und darf nicht als "nichts zu schuetzen"
            # durchgehen.
            clean=$(printf '%s\n' ${vers} | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)
            if [ -z "$clean" ]; then
              echo "::error::${pin}: keine gueltige Version in 'versions=${vers}'. Abbruch (fail closed)."
              exit 1
            fi

            upd_ts=$(date -u -d "$upd" +%s 2>/dev/null || echo 0)
            if [ "$upd_ts" -eq 0 ]; then
              echo "::error::${pin}: 'updated=${upd}' ist kein lesbarer Zeitstempel. Abbruch (fail closed)."
              exit 1
            fi
            age_d=$(( (now_ts - upd_ts) / 86400 ))
            if [ "$age_d" -gt "${PIN_MAX_DAYS}" ]; then
              echo "::error::${pin}: seit ${age_d} Tagen nicht aufgefrischt (Grenze ${PIN_MAX_DAYS})."
              echo "::error::Der woechentliche Heartbeat in ${repo} laeuft offenbar nicht — die Datenlage ist nicht mehr vertrauenswuerdig."
              echo "::error::Abbruch ohne zu loeschen (fail closed)."
              exit 1
            fi
            if [ "$age_d" -gt "${PIN_WARN_DAYS}" ]; then
              echo "::warning::${pin}: seit ${age_d} Tagen nicht aufgefrischt — Heartbeat in ${repo} pruefen."
            fi

            one=$(printf '%s\n' ${clean} | tr '\n' ' ')
            protected="${protected} ${one}"
            pin_report="${pin_report}| \`${repo}\` | \`${one% }\` | ${age_d} d |"$'\n'
            echo "::notice::${repo}: ${one% }  (Pin ${age_d} Tage alt)"
          done
          protected=$(printf '%s\n' ${protected} | sort -u | tr '\n' ' ')

          # ── Schritt 2: Bodenlinie bestimmen ──────────────────────────────────────
          # Die aelteste referenzierte Version legt fest, wie weit zurueck ueberhaupt
          # aufgeraeumt werden darf. Laesst sich eine referenzierte Version im Register
          # nicht mehr finden, ist genau der Schaden schon eingetreten, den dieser
          # Workflow verhindern soll — dann wird nicht auch noch nachgelegt.
          declare -A refdate
          while IFS=$'\t' read -r n c; do refdate["$n"]="$c"; done < <(
            gh api --paginate "/orgs/${ORG}/packages/maven/${REF_PACKAGE}/versions?per_page=100" \
              --jq '.[] | [.name, .created_at] | @tsv'
          )
          floor=""; floor_name=""
          for v in ${protected}; do
            d="${refdate[$v]:-}"
            if [ -z "$d" ]; then
              echo "::error::Referenzierte Version ${v} existiert in ${REF_PACKAGE} nicht (mehr)."
              echo "::error::Eine benutzte Version fehlt bereits im Register — erst klaeren, dann aufraeumen."
              echo "::error::Abbruch ohne zu loeschen (fail closed)."
              exit 1
            fi
            if [ -z "$floor" ] || [[ "$d" < "$floor" ]]; then floor="$d"; floor_name="$v"; fi
          done

          floor_age_d=$(( (now_ts - $(date -u -d "$floor" +%s)) / 86400 ))
          echo "::notice::geschuetzt: ${protected}"
          echo "::notice::Bodenlinie: ${floor_name} (${floor}, ${floor_age_d} Tage alt) — nichts Neueres wird geloescht"
          echo "::notice::dry-run=${DRY_RUN}  keep-newest=${KEEP_NEWEST}"
          if [ "$floor_age_d" -gt 30 ]; then
            echo "::warning::Die aelteste benutzte Version (${floor_name}) ist ${floor_age_d} Tage alt — eine App haengt weit zurueck, entsprechend wenig kann aufgeraeumt werden."
          fi

          mapfile -t packages < <(
            gh api --paginate "/orgs/${ORG}/packages?package_type=maven&per_page=100" \
              --jq '.[] | select(.name | startswith("deleted_") | not) | .name'
          )
          echo "::notice::${#packages[@]} Maven-Pakete gefunden"

          total_del=0; total_fail=0; total_keep=0; total_snap=0; total_prot=0; total_floor=0

          for pkg in "${packages[@]}"; do
            enc=${pkg//\//%2F}

            # Alle Versionen, neueste zuerst (nach created_at).
            mapfile -t rows < <(
              gh api --paginate "/orgs/${ORG}/packages/maven/${enc}/versions?per_page=100" \
                --jq '.[] | [.id, .name, .created_at] | @tsv' \
              | sort -t"$(printf '\t')" -k3,3r
            )
            [ ${#rows[@]} -eq 0 ] && continue

            del_ids=(); del_names=(); rank=0
            for row in "${rows[@]}"; do
              IFS=$'\t' read -r id name created <<<"$row"
              if [[ "${name^^}" == *SNAPSHOT* ]]; then
                del_ids+=("$id"); del_names+=("$name"); total_snap=$((total_snap + 1)); continue
              fi
              rank=$((rank + 1))
              if [ "$rank" -le "${KEEP_NEWEST}" ]; then
                total_keep=$((total_keep + 1)); continue
              fi
              # Schutz (a): namentlich referenziert — bleibt, egal wie alt.
              if [[ " ${protected} " == *" ${name} "* ]]; then
                echo "::notice::${pkg}: ${name} bleibt (aktiv referenziert, ausserhalb der neuesten ${KEEP_NEWEST})"
                total_prot=$((total_prot + 1)); continue
              fi
              # Schutz (b): nicht aelter als die aelteste referenzierte Version.
              if [[ ! "$created" < "$floor" ]]; then
                echo "::notice::${pkg}: ${name} bleibt (nicht aelter als die Bodenlinie ${floor_name})"
                total_floor=$((total_floor + 1)); continue
              fi
              del_ids+=("$id"); del_names+=("$name")
            done

            if [ ${#del_ids[@]} -ge ${#rows[@]} ]; then
              echo "::warning::${pkg}: Regel wuerde ALLE ${#rows[@]} Versionen treffen — uebersprungen"
              continue
            fi
            if [ ${#del_ids[@]} -eq 0 ]; then
              echo "::notice::${pkg}: nichts zu tun (${#rows[@]} Versionen)"
              continue
            fi

            if [ "${DRY_RUN}" = "true" ]; then
              echo "::notice::${pkg}: wuerde ${#del_ids[@]} von ${#rows[@]} loeschen — ${del_names[*]}"
              total_del=$((total_del + ${#del_ids[@]}))
              continue
            fi

            pkg_del=0; pkg_fail=0
            for i in "${!del_ids[@]}"; do
              id=${del_ids[$i]}
              ok=false
              for attempt in 1 2 3; do
                if gh api -X DELETE "/orgs/${ORG}/packages/maven/${enc}/versions/${id}" >/dev/null 2>&1; then
                  ok=true; break
                fi
                sleep $((attempt * 5))
              done
              if [ "$ok" = true ]; then
                pkg_del=$((pkg_del + 1))
              else
                pkg_fail=$((pkg_fail + 1))
                echo "::warning::${pkg}: Version ${del_names[$i]} (${id}) nicht loeschbar"
              fi
            done
            echo "::notice::${pkg}: deleted=${pkg_del} failed=${pkg_fail} kept=$(( ${#rows[@]} - pkg_del ))"
            total_del=$((total_del + pkg_del)); total_fail=$((total_fail + pkg_fail))
          done

          echo "::notice::TOTAL deleted=${total_del} failed=${total_fail} kept=${total_keep} protected=${total_prot} floor=${total_floor} snapshots=${total_snap}"
          label="geloescht"
          [ "${DRY_RUN}" = "true" ] && label="wuerde geloescht"
          {
            echo "## housekeeping — ${TASK}"
            echo ""
            echo "### Schutzinformation aus \`pins/\`"
            echo ""
            echo "| Consumer | benutzte Versionen | Pin-Alter |"
            echo "|---|---|---|"
            printf '%s' "${pin_report}"
            echo ""
            echo "Bodenlinie: **${floor_name}** (${floor}) — nichts Neueres wird geloescht."
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Pakete | ${#packages[@]} |"
            echo "| ${label} | ${total_del} |"
            echo "| fehlgeschlagen | ${total_fail} |"
            echo "| behalten (neueste ${KEEP_NEWEST}) | ${total_keep} |"
            echo "| zusaetzlich behalten (namentlich referenziert) | ${total_prot} |"
            echo "| zusaetzlich behalten (ueber der Bodenlinie) | ${total_floor} |"
            echo "| davon SNAPSHOTs geloescht | ${total_snap} |"
          } >> "$GITHUB_STEP_SUMMARY"
