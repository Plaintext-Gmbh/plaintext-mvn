name: housekeeping

# Manually-triggered chores fuer die Maven-Pakete dieses Repos. Task aus dem Dropdown waehlen:
#
#  * **prunePackagesDryRun** — zeigt NUR an, was geloescht wuerde. Nichts wird angefasst.
#  * **prunePackages**       — loescht tatsaechlich.
#
# Regel (identisch in beiden Tasks, nur das Loeschen unterscheidet sie):
#
#   1. Jede Version mit `-SNAPSHOT` im Namen faellt weg. Sie hat nach dem zugehoerigen
#      Release keinen Wert mehr: Die Apps (app/iot/schuetu/guild) bauen per fester
#      Familienregel immer gegen eine RELEASED root-Version, nie gegen einen SNAPSHOT,
#      und root selbst baut seine Module aus dem eigenen Reactor.
#   2. Von den Releases bleiben die neuesten KEEP_NEWEST (30) stehen — plus alles, was
#      juenger als KEEP_DAYS (90) Tage ist. Es gilt die grosszuegigere der beiden
#      Bedingungen, damit ein Projekt, das laenger nicht nachgezogen hat, nicht ins
#      Leere laeuft.
#   3. Ein Paket wird nie vollstaendig geleert.
#
# WARUM DAS HYGIENE IST UND KEINE KOSTENFRAGE (23.08.2026, Karte 942):
# Dieses Repo ist oeffentlich und alle 30 Pakete sind es auch. Oeffentliche Pakete sind
# bei GitHub kostenlos — gemessen an der Billing-API wird der Packages-Storage zwar
# ausgewiesen (im August 8 800 GB-Stunden, brutto 2,96 $), aber zu 100 % rabattiert,
# netto 0 $. Der Speicher hier hat also NIE Geld gekostet und war auch nicht die Ursache
# der blockierten Artefakt-Uploads — das war der Actions-Storage (siehe plaintext-scripts
# PR #83). Dieser Workflow haelt den Bestand schlank und uebersichtlich, mehr nicht.
# Die Pakete bleiben bewusst veroeffentlicht, damit sie jemand nutzen kann.
#
# Token: GITHUB_TOKEN mit `packages: write` reicht, solange die Pakete an dieses Repo
# gebunden sind. Antwortet die API mit 403, liegt ein PAT mit `delete:packages` als
# Secret PACKAGES_PRUNE_TOKEN bereit und wird bevorzugt benutzt.

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Task to run'
        required: true
        default: 'prunePackagesDryRun'
        type: choice
        options:
          - prunePackagesDryRun
          - prunePackages

permissions:
  packages: write
  contents: read

env:
  KEEP_NEWEST: '30'
  KEEP_DAYS: '90'

jobs:
  run:
    name: ${{ inputs.task }}
    runs-on: ubuntu-22.04
    steps:
      - name: ${{ inputs.task }}
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_PRUNE_TOKEN || github.token }}
          ORG: ${{ github.repository_owner }}
          TASK: ${{ inputs.task }}
          DRY_RUN: ${{ inputs.task == 'prunePackagesDryRun' && 'true' || 'false' }}
        run: |
          set -euo pipefail

          cutoff=$(date -u -d "-${KEEP_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          echo "::notice::dry-run=${DRY_RUN}  keep-newest=${KEEP_NEWEST}  keep-since=${cutoff}"

          mapfile -t packages < <(
            gh api --paginate "/orgs/${ORG}/packages?package_type=maven&per_page=100" \
              --jq '.[] | select(.name | startswith("deleted_") | not) | .name'
          )
          echo "::notice::${#packages[@]} Maven-Pakete gefunden"

          total_del=0; total_fail=0; total_keep=0; total_snap=0

          for pkg in "${packages[@]}"; do
            enc=${pkg//\//%2F}

            # Alle Versionen, neueste zuerst. id, name und created_at tabgetrennt.
            mapfile -t rows < <(
              gh api --paginate "/orgs/${ORG}/packages/maven/${enc}/versions?per_page=100" \
                --jq '.[] | [.id, .name, .created_at] | @tsv' \
              | sort -t"$(printf '\t')" -k3,3r
            )
            [ ${#rows[@]} -eq 0 ] && continue

            # Kandidaten bestimmen: SNAPSHOTs immer, Releases nur ausserhalb beider Schutzregeln.
            del_ids=(); del_names=(); rank=0
            for row in "${rows[@]}"; do
              IFS=$'\t' read -r id name created <<<"$row"
              if [[ "${name^^}" == *SNAPSHOT* ]]; then
                del_ids+=("$id"); del_names+=("$name"); total_snap=$((total_snap + 1)); continue
              fi
              rank=$((rank + 1))
              if [ "$rank" -le "${KEEP_NEWEST}" ] || [[ "$created" > "$cutoff" ]]; then
                total_keep=$((total_keep + 1)); continue
              fi
              del_ids+=("$id"); del_names+=("$name")
            done

            # Schutz: niemals das ganze Paket leeren.
            if [ ${#del_ids[@]} -ge ${#rows[@]} ]; then
              echo "::warning::${pkg}: Regel wuerde ALLE ${#rows[@]} Versionen treffen — uebersprungen"
              continue
            fi
            if [ ${#del_ids[@]} -eq 0 ]; then
              echo "::notice::${pkg}: nichts zu tun (${#rows[@]} Versionen)"
              continue
            fi

            if [ "${DRY_RUN}" = "true" ]; then
              echo "::notice::${pkg}: wuerde ${#del_ids[@]} von ${#rows[@]} loeschen — z.B. ${del_names[*]:0:5}"
              total_del=$((total_del + ${#del_ids[@]}))
              continue
            fi

            pkg_del=0; pkg_fail=0
            for i in "${!del_ids[@]}"; do
              id=${del_ids[$i]}
              ok=false
              for attempt in 1 2 3; do
                if gh api -X DELETE "/orgs/${ORG}/packages/maven/${enc}/versions/${id}" >/dev/null 2>&1; then
                  ok=true; break
                fi
                sleep $((attempt * 5))
              done
              if [ "$ok" = true ]; then
                pkg_del=$((pkg_del + 1))
              else
                pkg_fail=$((pkg_fail + 1))
                echo "::warning::${pkg}: Version ${del_names[$i]} (${id}) nicht loeschbar"
              fi
            done
            echo "::notice::${pkg}: deleted=${pkg_del} failed=${pkg_fail} kept=$(( ${#rows[@]} - pkg_del ))"
            total_del=$((total_del + pkg_del)); total_fail=$((total_fail + pkg_fail))
          done

          echo "::notice::TOTAL deleted=${total_del} failed=${total_fail} kept=${total_keep} (davon SNAPSHOTs: ${total_snap})"
          label="geloescht"
          [ "${DRY_RUN}" = "true" ] && label="wuerde geloescht"
          {
            echo "## housekeeping — ${TASK}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Pakete | ${#packages[@]} |"
            echo "| ${label} | ${total_del} |"
            echo "| fehlgeschlagen | ${total_fail} |"
            echo "| behalten | ${total_keep} |"
            echo "| davon SNAPSHOTs | ${total_snap} |"
          } >> "$GITHUB_STEP_SUMMARY"
